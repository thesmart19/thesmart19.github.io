<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intent</title>
</head>
<body>
    <h1>Android Intents with Chrome</h1>
    <h2>Click to open URL</h2>
    <h3></h3>
    <h4></h4>
    Event stack:
    <pre style="white-space:wrap"></pre>

    <script>
        (() => {
            const intentPackage = 'com.android.chrome';
            const intentScheme = 'https';
            const intentUrl = 'https://www.google.com/search?q=succes';
            const intentUrlFallback = 'https://www.google.com/search?q=what+is+chrome+intent+fallback+url';
            let eventStack = [];

            let intentURI = `intent://${intentUrl}#Intent;`
            intentURI += `package=${intentPackage};`
            intentURI += `action=android.intent.action.VIEW;`
            intentURI += `category=android.intent.category.BROWSABLE;`
            intentURI += `scheme=${intentScheme};`
            intentURI += `S.browser_fallback_url=${encodeURIComponent(intentUrlFallback)};`
            intentURI += 'end;'

            const regex = {
                android: 'android',
                webview: 'webview|; wv\\)',
            }

            function is(pattern) {
                return Boolean(navigator.userAgent.match(new RegExp(pattern, 'ig')))
            }

            const isAndroid = is(regex.android);
            const isAndroidWebView = is(regex.webview);
            const ua = navigator.userAgent;
            const chromeVersionChromeMatch = ua.match(/Chrome\/([0-9]{1,})/) || [];
            const chromeVersionCriOSMatch = ua.match(/CriOS\/([0-9]{1,})/) || [];
            const chromeVersion = parseInt(chromeVersionChromeMatch[1], 10) || parseInt(chromeVersionCriOSMatch[1], 10);
            const isYandexBrowser = /YaBrowser/.test(ua);
            const isChrome = chromeVersion && !isYandexBrowser;

            if (isAndroid) {
                document.querySelector('h3').innerText += 'Browser:' + (isAndroidWebView ? 'Android WebView' : isChrome ? 'Chrome' : 'Other');

                function detectApp() {
                    document.querySelector('pre').innerText = JSON.stringify(eventStack, null, 2);
                    if (isChrome) {
                        const clickIndex = eventStack.findIndex(e => e.event === 'click');

                        if (clickIndex > -1 &&
                            eventStack.length >= clickIndex + 3 &&
                            eventStack[clickIndex].event === 'click' &&
                            eventStack[clickIndex + 1].event === 'beforeunload' &&
                            eventStack[clickIndex + 2].event === 'beforeunload') {
                            document.querySelector('h4').innerText = 'Failed to open. Redirecting to fallback url...';
                        } else if (clickIndex > -1 &&
                            eventStack.length >= clickIndex + 3 &&
                            eventStack[clickIndex].event === 'click' &&
                            eventStack[clickIndex + 1].event === 'beforeunload' &&
                            eventStack[clickIndex + 2].event === 'hidden') {
                            document.querySelector('h4').innerText = 'Success!';
                        }
                    }
                }

                document.addEventListener("visibilitychange", () => {
                    eventStack.push({
                        event: document.visibilityState,
                        time: Date.now(),
                    });
                    detectApp();
                });

                window.addEventListener("beforeunload", () => {
                    eventStack.push({
                        event: 'beforeunload',
                        time: Date.now(),
                    });
                    detectApp();
                });

                document.addEventListener('click', () => {
                    eventStack.push({
                        event: 'click',
                        time: Date.now(),
                    });
                    detectApp();
                    document.location.href = intentURI;
                });

                detectApp();
            } else {
                document.querySelector('h2').innerText = 'Intent works only on Android devices.';
            }
        })()
    </script>
</html>
